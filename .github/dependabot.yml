version: 2
updates:
  # GitHub Actions used by CI / Pages
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)

  # Docs site (Astro + Starlight)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docs
    commit-message:
      prefix: chore(docs)
    versioning-strategy: increase

  # Dev container features / base image
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - devcontainer
    commit-message:
      prefix: chore(devcontainer)

  # Terraform providers / modules
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: chore(tf)
