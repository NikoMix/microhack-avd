name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/.git/**

  links:
    name: Link check (offline / relative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lychee (relative links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress './**/*.md'"
          fail: true

  bicep:
    name: Bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Bicep files
        id: detect
        run: echo "count=$(find infra -name '*.bicep' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Install Bicep
        if: steps.detect.outputs.count != '0'
        run: az bicep install
      - name: Build (lints on build)
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          find infra -name '*.bicep' -print0 | while IFS= read -r -d '' f; do
            echo "::group::az bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null
            echo "::endgroup::"
          done

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Terraform
        id: detect
        run: |
          if [ -f infra/terraform/main.tf ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.detect.outputs.present == 'true'
        with:
          terraform_version: latest
      - name: fmt
        if: steps.detect.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: init (no backend)
        if: steps.detect.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: validate
        if: steps.detect.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform validate

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect scripts
        id: detect
        run: echo "count=$(find scripts -name '*.ps1' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Analyze
        if: steps.detect.outputs.count != '0'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity @('Warning','Error')
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors."
            exit 1
          }

  docs:
    name: Docs build (Astro / Starlight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect docs
        id: detect
        run: |
          if [ -f docs/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install + build
        if: steps.detect.outputs.present == 'true'
        working-directory: docs
        run: |
          npm ci
          npm run build

  slides:
    name: Slides render (Marp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect slides
        id: detect
        run: |
          if [ -f slides/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - name: Install + render
        if: steps.detect.outputs.present == 'true'
        working-directory: slides
        run: |
          npm ci
          npm run build
